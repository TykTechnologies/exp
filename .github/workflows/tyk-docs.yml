# yamllint disable rule:line-length
---
name: Tyk Docs sync

run-name: '[${{ inputs.jira }}] ${{ github.actor }} running tyk-docs sync'

# This workflow builds the documentation for a release.
# It uses the following external dependencies:
#
# Generator: tyk-config-info-generator
# Provides: tyk-docs/content/shared/gateway-config.md
# Source: https://github.com/TykTechnologies/tyk-config-info-generator
#
# Generator: schema-gen markdown
# Provides: tyk-docs/content/shared/x-tyk-gateway.md
# Source: https://github.com/TykTechnologies/exp/tree/main/cmd/schema-gen
#
# Generator: operator-crd-docs
# Provides: tyk-docs/snippets/operator-crd-reference.mdx (imported by the crd-reference page)
# Source: https://github.com/TykTechnologies/exp/tree/main/scripts/operator-crd-docs
#
# The schema-gen tool is provided using the tykio/ci-tools docker image.
# To rebuild that docker image if required, trigger an update via:
#
# https://github.com/TykTechnologies/tyk-github-actions/actions/workflows/ci-docker-tools.yml
#
# You can test the schema-gen docs generator in this repo: pkg/model/Taskfile.yml;
# Running the taskfile with `task` will generate gateway/README.md, among other files.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      jira:
        description: JIRA ID (MM-NNNN or permalink)
        required: true
        default: ''
      sync-gateway:
        description: Include Gateway
        type: boolean
      sync-dashboard:
        description: Include Dashboard
        type: boolean
      sync-pump:
        description: Include Pump
        type: boolean
      sync-mdcb:
        description: Include MDCB
        type: boolean
      sync-portal:
        description: Include Portal (only swagger)
        type: boolean
      sync-operator:
        description: Include Tyk Operator CRD reference
        type: boolean
      sync-ai-studio:
        description: Include AI Studio (only swagger)
        type: boolean
      docs-branch:
        description: 'Destination branch in tyk-docs to open the PR against. Use main for the latest and release-x.y for LTS'
        type: string
        required: true
        default: 'main'
      default-source-branch:
        description: 'Branch to pull from every component repo. Leave blank to use each component''s own default branch. Overridden per-component by the fields below.'
        type: string
        default: ''
      gateway-branch:
        description: 'Override: Gateway (tyk) source branch. Blank uses the default above.'
        type: string
        default: ''
      dashboard-branch:
        description: 'Override: Dashboard (tyk-analytics) source branch. Blank uses the default above.'
        type: string
        default: ''
      pump-branch:
        description: 'Override: Pump source branch. Blank uses the default above.'
        type: string
        default: ''
      mdcb-branch:
        description: 'Override: MDCB (tyk-sink) source branch. Blank uses the default above.'
        type: string
        default: ''
      portal-branch:
        description: 'Override: Portal source branch. Blank uses the default above.'
        type: string
        default: ''
      operator-branch:
        description: 'Override: Tyk Operator (tyk-operator-internal) source branch. Blank uses the default above.'
        type: string
        default: ''
      ai-studio-branch:
        description: 'Override: AI Studio source branch. Blank uses the default above, or "main" if no default is set.'
        type: string
        default: ''
      branch-suffix:
        description: 'Branch suffix to append to PR branch name (to prevent collisions on multiple PRs/ticket)'
        required: true
        default: 'docs'
      note:
        description: 'Note for PR'
        required: true
        default: '<none>'

env:
  GOPRIVATE: github.com/TykTechnologies
  configInfoGeneratorBranch: main

jobs:
  sanitize:
    name: Sanitize inputs
    runs-on: ubuntu-latest
    outputs:
      docsBranch: ${{ steps.collect.outputs.docsBranch }}
      docsVersion: ${{ steps.collect.outputs.docsVersion }}
      jira: ${{ steps.collect.outputs.jira }}
      gatewayBranch: ${{ steps.collect.outputs.gatewayBranch }}
      dashboardBranch: ${{ steps.collect.outputs.dashboardBranch }}
      portalBranch: ${{ steps.collect.outputs.portalBranch }}
      operatorBranch: ${{ steps.collect.outputs.operatorBranch }}
      aiStudioBranch: ${{ steps.collect.outputs.aiStudioBranch }}
      pumpBranch: ${{ steps.collect.outputs.pumpBranch }}
      mdcbBranch: ${{ steps.collect.outputs.mdcbBranch }}
    steps:
      - name: Sanitize JIRA input
        run: |
          jira=$(echo '${{ github.event.inputs.jira }}' | sed -e 's/?.*//g' | xargs -n1 basename)
          if [ "$jira" == *"-"* ]; then
             echo "No valid JIRA ID found (no dash in JIRA ID)"
             exit 1
          fi
          echo "jira=$jira" >> $GITHUB_ENV

      # Each component resolves to: its own override, else the shared default-source-branch,
      # else the component repo's own default branch (only AI Studio differs: "main" not "master").
      # docsVersion is a human-readable label for docs-branch, used in PR titles (main -> Master, release-5.13 -> 5.13).
      - name: Resolve source and destination branches
        run: |
          defaultSourceBranch="${{ github.event.inputs.default-source-branch }}"

          resolve() {
            local override="$1" fallback="$2"
            if [ -n "$override" ]; then
              echo "$override"
            elif [ -n "$defaultSourceBranch" ]; then
              echo "$defaultSourceBranch"
            else
              echo "$fallback"
            fi
          }

          docsBranch="${{ github.event.inputs.docs-branch }}"
          case "$docsBranch" in
            main) docsVersion="Master" ;;
            release-*) docsVersion="${docsBranch#release-}" ;;
            *) docsVersion="$docsBranch" ;;
          esac

          echo "docsBranch=$docsBranch" >> $GITHUB_ENV
          echo "docsVersion=$docsVersion" >> $GITHUB_ENV
          echo "gatewayBranch=$(resolve "${{ github.event.inputs.gateway-branch }}" master)" >> $GITHUB_ENV
          echo "dashboardBranch=$(resolve "${{ github.event.inputs.dashboard-branch }}" master)" >> $GITHUB_ENV
          echo "pumpBranch=$(resolve "${{ github.event.inputs.pump-branch }}" master)" >> $GITHUB_ENV
          echo "mdcbBranch=$(resolve "${{ github.event.inputs.mdcb-branch }}" master)" >> $GITHUB_ENV
          echo "portalBranch=$(resolve "${{ github.event.inputs.portal-branch }}" master)" >> $GITHUB_ENV
          echo "operatorBranch=$(resolve "${{ github.event.inputs.operator-branch }}" master)" >> $GITHUB_ENV
          echo "aiStudioBranch=$(resolve "${{ github.event.inputs.ai-studio-branch }}" main)" >> $GITHUB_ENV

      - id: collect
        run: |
             echo "jira=${{ env.jira }}" >> $GITHUB_OUTPUT
             echo "docsBranch=${{ env.docsBranch }}" >> $GITHUB_OUTPUT
             echo "docsVersion=${{ env.docsVersion }}" >> $GITHUB_OUTPUT
             echo "gatewayBranch=${{ env.gatewayBranch }}" >> $GITHUB_OUTPUT
             echo "dashboardBranch=${{ env.dashboardBranch }}" >> $GITHUB_OUTPUT
             echo "portalBranch=${{ env.portalBranch }}" >> $GITHUB_OUTPUT
             echo "operatorBranch=${{ env.operatorBranch }}" >> $GITHUB_OUTPUT
             echo "aiStudioBranch=${{ env.aiStudioBranch }}" >> $GITHUB_OUTPUT
             echo "pumpBranch=${{ env.pumpBranch }}" >> $GITHUB_OUTPUT
             echo "mdcbBranch=${{ env.mdcbBranch }}" >> $GITHUB_OUTPUT
  
  # Generates Tyk OAS specification & Gateway swagger
  gateway:
    needs: [sanitize]
    name: Gateway docs
    if: ${{ github.event.inputs.sync-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          repository: TykTechnologies/tyk
          ref: ${{ needs.sanitize.outputs.gatewayBranch }}
          path: ./tyk

      - name: Checkout exp
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          path: ./exp

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed  # v5.1.0
        with:
          go-version: "1.21"

      - name: Install schema-gen
        run: |
          cd ./exp/cmd/schema-gen && GOBIN=/usr/local/bin go install .

      - run: mkdir -p gateway-docs/
      
      - name: Generate x-tyk-gateway docs
        working-directory: ./tyk/apidef/oas
        run: |
          schema-gen extract -o - | schema-gen markdown -i - \
                                                        --root XTykAPIGateway \
                                                        --skip "OldOAS,APIDef,OAS,TykExtensionConfigParams,ServerRegenerationConfig" \
                                                        --title "## Tyk vendor extension reference" \
                                                        --replace "tyktime.ReadableDuration=string,model.ObjectID=string,apidef.MiddlewareDriver=string,apidef.IdExtractorSource=string,apidef.IdExtractorType=string,apidef.RequestInputType=string,apidef.AuthTypeEnum=string,[]osin.AuthorizeRequestType=[]string" \
                                                        --heading-format "### **%s**" \
                                                        --trim "Tyk classic API definition" \
                                                        -o ../../../gateway-docs/x-tyk-gateway.mdx

      - name: Generate Docs
        run: |
          # Make a temp file for modifications
          cp ./tyk/swagger.yml ./swagger-modified.yml

          # The below modifications are required for Mintlify, because it cannot resolve external $ref links.

          # Replace both with and without single quotes
          sed -i "s|'https://raw.githubusercontent.com/TykTechnologies/tyk/refs/heads/master/apidef/oas/schema/3.0.json'|'#/components/schemas/OpenAPI3Schema'|g" ./swagger-modified.yml
          sed -i "s|https://raw.githubusercontent.com/TykTechnologies/tyk/refs/heads/master/apidef/oas/schema/3.0.json|'#/components/schemas/OpenAPI3Schema'|g" ./swagger-modified.yml

          # Append the new schema definition under components.schemas
          # We assume `components:` and `schemas:` already exist in the file
          awk '
            {print}
            /schemas:/ && !done {
              print "    OpenAPI3Schema:"
              print "      type: object"
              print "      additionalProperties: true"
              done=1
            }
          ' ./swagger-modified.yml > ./swagger-final.yml

          # Copy to gateway-docs
          cp ./swagger-final.yml gateway-docs/gateway-swagger.yml


      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: gateway-docs
          path: gateway-docs

  # Generates dashboard OPA rules & Dashboard swagger
  dashboard:
    needs: [sanitize]
    name: Dashboard docs
    if: ${{ github.event.inputs.sync-dashboard == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Checkout Dashboard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          repository: TykTechnologies/tyk-analytics
          ref: ${{ needs.sanitize.outputs.dashboardBranch }}
          path: ./tyk-analytics

      - name: Generate Docs
        run: |
          # Make a temp file for modifications
          cp ./tyk-analytics/swagger.yml ./swagger-modified.yml

          # The below modifications are required for Mintlify, because it cannot resolve external $ref links.

          # Replace both with and without single quotes
          sed -i "s|'https://raw.githubusercontent.com/TykTechnologies/tyk/refs/heads/master/apidef/oas/schema/3.0.json'|'#/components/schemas/OpenAPI3Schema'|g" ./swagger-modified.yml
          sed -i "s|https://raw.githubusercontent.com/TykTechnologies/tyk/refs/heads/master/apidef/oas/schema/3.0.json|'#/components/schemas/OpenAPI3Schema'|g" ./swagger-modified.yml

          # Append the new schema definition under components.schemas
          # We assume `components:` and `schemas:` already exist in the file
          awk '
            {print}
            /schemas:/ && !done {
              print "    OpenAPI3Schema:"
              print "      type: object"
              print "      additionalProperties: true"
              done=1
            }
          ' ./swagger-modified.yml > ./swagger-final.yml

          mkdir -p dashboard-docs/
          cp ./swagger-final.yml dashboard-docs/dashboard-swagger.yml
          cp ./tyk-analytics/swagger-admin.yml dashboard-docs/dashboard-admin-swagger.yml
          cp ./tyk-analytics/docs/opa/opa-rules.md dashboard-docs/opa-rules.mdx

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: dashboard-docs
          path: dashboard-docs

  # Generates MDCB swagger
  mdcb:
    needs: [sanitize]
    name: MDCB docs
    if: ${{ github.event.inputs.sync-mdcb == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Checkout MDCB
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          repository: TykTechnologies/tyk-sink
          ref: ${{ needs.sanitize.outputs.mdcbBranch }}
          path: ./tyk-sink

      - name: Generate docs
        run: |
          mkdir -p mdcb-docs/
          cp ./tyk-sink/swagger.yml mdcb-docs/mdcb-swagger.yml

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: mdcb-docs
          path: mdcb-docs

  # Generates Portal Admin API swagger
  portal:
    needs: [sanitize]
    name: Portal docs
    if: ${{ github.event.inputs.sync-portal == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Checkout Portal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          repository: TykTechnologies/portal
          ref: ${{ needs.sanitize.outputs.portalBranch }}
          path: ./portal

      - name: Generate docs
        run: |
          mkdir -p portal-docs/
          cp ./portal/docs/api/enterprise-developer-portal-swagger.yaml portal-docs/enterprise-developer-portal-swagger.yaml

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: portal-docs
          path: portal-docs

  # Generates the Tyk Operator CRD field reference (single dot-notation MDX page)
  operator:
    needs: [sanitize]
    name: Operator CRD docs
    if: ${{ github.event.inputs.sync-operator == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Checkout Tyk Operator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          repository: TykTechnologies/tyk-operator-internal
          ref: ${{ needs.sanitize.outputs.operatorBranch }}
          path: ./tyk-operator-internal

      - name: Checkout exp
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          path: ./exp

      - name: Generate CRD reference page
        run: |
          python3 -m pip install --quiet -r ./exp/scripts/operator-crd-docs/requirements.txt
          mkdir -p operator-docs
          python3 ./exp/scripts/operator-crd-docs/gen.py \
            ./tyk-operator-internal/config/crd/bases \
            ./operator-docs/operator-crd-reference.mdx

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: operator-docs
          path: operator-docs

  # Generates AI Studio swagger
  ai-studio:
    needs: [sanitize]
    name: AI Studio docs
    if: ${{ github.event.inputs.sync-ai-studio == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Studio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          repository: TykTechnologies/ai-studio
          ref: ${{ needs.sanitize.outputs.aiStudioBranch }}
          path: ./ai-studio

      - name: Generate docs
        run: |
          mkdir -p ai-studio-docs/

          # ai-studio's swagger.yaml is Swagger 2.0 (OpenAPI 2.0). Mintlify does not
          # support that version (https://www.mintlify.com/docs/api-playground/troubleshooting)
          # and fails the whole tyk-docs deployment if it's given a 2.0 doc, so convert
          # to OpenAPI 3.0 via SmartBear's public converter service before handing it off.
          http_status=$(curl -sS -w "%{http_code}" -o ai-studio-docs/ai-studio-swagger.yml \
            -X POST https://converter.swagger.io/api/convert \
            -H "Content-Type: application/yaml" \
            -H "Accept: application/yaml" \
            --data-binary @./ai-studio/docs/swagger/swagger.yaml)

          if [ "$http_status" != "200" ]; then
            echo "❌ Swagger 2.0 -> OpenAPI 3.0 conversion failed (HTTP $http_status):"
            cat ai-studio-docs/ai-studio-swagger.yml
            exit 1
          fi

          if ! grep -q "^openapi: 3\." ai-studio-docs/ai-studio-swagger.yml; then
            echo "❌ Converted file doesn't declare an OpenAPI 3.x version - conversion likely failed:"
            cat ai-studio-docs/ai-studio-swagger.yml
            exit 1
          fi

          echo "✅ Converted to OpenAPI 3.0"

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: ai-studio-docs
          path: ai-studio-docs

  # Generates environment configuration docs for Gateway, Dashboard, Pump, and MDCB
  configs:
    needs: [sanitize]
    name: Configuration docs
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Install Config Generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: TykTechnologies/tyk-config-info-generator
          path: ./tyk-config-info-generator
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ env.configInfoGeneratorBranch }}

      - name: Set up env
        run: |
             mkdir -p $GITHUB_WORKSPACE/config-docs/
             echo "gatewayBranch=${{ needs.sanitize.outputs.gatewayBranch }}" >> $GITHUB_ENV
             echo "dashboardBranch=${{ needs.sanitize.outputs.dashboardBranch }}" >> $GITHUB_ENV
             echo "docsBranch=${{ needs.sanitize.outputs.docsBranch }}" >> $GITHUB_ENV

      - name: Sync Gateway
        working-directory: ./tyk-config-info-generator/src
        if: ${{ github.event.inputs.sync-gateway == 'true' }}
        run: |
          repo=gateway
          branch=$gatewayBranch
          dest=$GITHUB_WORKSPACE/config-docs/$repo-config.mdx

          sudo TOKEN=${{ steps.app-token.outputs.token }} node app.js $repo:$branch
          cp /node/home/tyk-config-info-generator/info/$branch/gateway.md $dest

      - name: Sync Dashboard
        working-directory: ./tyk-config-info-generator/src
        if: ${{ github.event.inputs.sync-dashboard == 'true' }}
        run: |
          repo=dashboard
          branch=$dashboardBranch
          dest=$GITHUB_WORKSPACE/config-docs/$repo-config.mdx

          sudo TOKEN=${{ steps.app-token.outputs.token }} node app.js $repo:$branch
          cp /node/home/tyk-config-info-generator/info/$branch/$repo.md $dest

      - name: Sync Pump
        working-directory: ./tyk-config-info-generator/src
        if: ${{ github.event.inputs.sync-pump == 'true' }}
        run: |
          repo=pump
          branch=${{ needs.sanitize.outputs.pumpBranch }}
          dest=$GITHUB_WORKSPACE/config-docs/$repo-config.mdx

          sudo TOKEN=${{ steps.app-token.outputs.token }} node app.js $repo:$branch
          cp /node/home/tyk-config-info-generator/info/$branch/$repo.md $dest

      - name: Sync MDCB
        working-directory: ./tyk-config-info-generator/src
        if: ${{ github.event.inputs.sync-mdcb == 'true' }}
        run: |
          repo=mdcb
          branch=${{ needs.sanitize.outputs.mdcbBranch }}
          dest=$GITHUB_WORKSPACE/config-docs/$repo-config.mdx

          sudo TOKEN=${{ steps.app-token.outputs.token }} node app.js $repo:$branch
          cp /node/home/tyk-config-info-generator/info/$branch/$repo.md $dest

      - name: Store docs
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: config-docs
          path: config-docs

  # Each component below opens its own PR against tyk-docs, so a run that
  # touches several components doesn't land as one oversized review.
  finish-gateway:
    name: Open PR — Gateway
    needs: [sanitize, gateway, configs]
    if: ${{ always() && github.event.inputs.sync-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Download Gateway docs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: gateway-docs
          path: gateway-docs

      - name: Download config docs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: config-docs
          path: config-docs

      - name: Checkout exp repo (for cleanup script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: ./exp  # this repo where your Python script lives

      - name: Clean duplicate OAS entries
        run: |
          cd exp
          python3 scripts/remove-oas-dublicates/index.py --input-file ../gateway-docs/x-tyk-gateway.mdx

      - name: Set up env
        run: |
             echo "jira=${{ needs.sanitize.outputs.jira }}" >> $GITHUB_ENV
             echo "target=${{ needs.sanitize.outputs.docsBranch }}" >> $GITHUB_ENV

      - name: Checkout Docs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          repository: TykTechnologies/tyk-docs
          path: ./tyk-docs
          ref: ${{ needs.sanitize.outputs.docsBranch }}

      - name: Write out docs
        run: |
             cp gateway-docs/*.yml ./tyk-docs/swagger/

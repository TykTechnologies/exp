# yamllint disable rule:line-length
---
name: Code Freeze Branch Creation

run-name: 'Creating ${{ inputs.destination_branch }} from ${{ inputs.source_branch }} by ${{ github.actor }}'

# This workflow creates code freeze branches across multiple repositories.
# It creates the same branch in all specified repositories from the specified source branch.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Repositories to create branch in'
        required: true
        type: choice
        options:
          - tyk-core-products
          - tyk-sink
          - tyk-pump
          - portal
          - tyk-operator-internal
          - tyk-sync-internal
          - tyk-charts
          - tyk-identity-broker
      source_branch:
        description: 'Source Branch (branch to create from)'
        required: true
      destination_branch:
        description: 'Destination Branch (branch to create)'
        required: true
      notify_slack:
        description: 'Send Slack notification when complete'
        type: boolean
        default: false

jobs:
  create-branches:
    name: Create branches in selected repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Build repository list
        id: build-repo-list
        run: |
          # Initialize empty array
          REPOS=()

          # Add repositories based on dropdown selection
          SELECTION="${{ github.event.inputs.repositories }}"
          if [ "$SELECTION" = "tyk-core-products" ]; then
            REPOS+=("tyk" "tyk-analytics" "tyk-analytics-ui")
          elif [ "$SELECTION" = "tyk-sink" ]; then
            REPOS+=("tyk-sink")
          elif [ "$SELECTION" = "tyk-pump" ]; then
            REPOS+=("tyk-pump")
          elif [ "$SELECTION" = "portal" ]; then
            REPOS+=("portal")
          elif [ "$SELECTION" = "tyk-operator-internal" ]; then
            REPOS+=("tyk-operator-internal")
          elif [ "$SELECTION" = "tyk-sync-internal" ]; then
            REPOS+=("tyk-sync-internal")
          elif [ "$SELECTION" = "tyk-charts" ]; then
            REPOS+=("tyk-charts")
          elif [ "$SELECTION" = "tyk-identity-broker" ]; then
            REPOS+=("tyk-identity-broker")
          fi
          
          # Convert array to JSON
          JSON_ARRAY=$(jq -nc '$ARGS.positional' --args -- "${REPOS[@]}")
          echo "repositories=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          
          # Create a comma-separated list for display
          REPOS_CSV=$(IFS=,; echo "${REPOS[*]}")
          echo "repositories_csv=$REPOS_CSV" >> "$GITHUB_OUTPUT"
          
          # Create Slack-formatted repository links
          REPOS_LINKS=""
          DEST_BRANCH_VAR="${{ github.event.inputs.destination_branch }}"
          for repo in "${REPOS[@]}"; do
            REPOS_LINKS="${REPOS_LINKS}- <https://github.com/TykTechnologies/${repo}/tree/${DEST_BRANCH_VAR} | ${repo}>\n"
          done
          echo "repositories_links<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$REPOS_LINKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          DEST_BRANCH: ${{ github.event.inputs.destination_branch }}
        run: |
          # Configure git to use the app token for all github.com access
          # This overrides any credential helpers set by actions/checkout
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Get repositories as JSON array
          REPOSITORIES='${{ steps.build-repo-list.outputs.repositories }}'

          failed=0

          # Loop through each repository
          for repo in $(echo "$REPOSITORIES" | jq -r '.[]'); do
            echo "Creating branch for repository: $repo"
            remote="https://github.com/TykTechnologies/$repo.git"

            # Clone repository
            git clone --depth 1 --branch "$SOURCE_BRANCH" "$remote"
            cd "$repo"

            # Push the source commit to the destination branch and let the
            # result say what happened. Do not pre-check whether the branch
            # exists: the clone is shallow and single-branch so it cannot see
            # other refs, and querying the remote separately is one more call
            # that can fail on its own and be misread.
            #
            # A push that succeeds reports "new branch" for a branch that was
            # created and "up-to-date" for one that already pointed here, so
            # the exit status alone cannot tell those apart.
            #
            # The "|| push_rc=$?" matters: this step runs under bash -e, where
            # a bare assignment from a failing command substitution aborts the
            # whole step before the status can be inspected.
            push_rc=0
            push_out=$(git push origin "HEAD:refs/heads/$DEST_BRANCH" 2>&1) || push_rc=$?
            echo "$push_out"

            if [ "$push_rc" -eq 0 ]; then
              if echo "$push_out" | grep -q "new branch"; then
                echo "✅ Created branch $DEST_BRANCH in $repo"
              else
                echo "Skipping $repo: $DEST_BRANCH already up to date"
              fi
            elif echo "$push_out" | grep -qiE "fetch first|non-fast-forward"; then
              # The branch exists at a different commit. Leave it alone rather
              # than force pushing, which would discard whatever is on it.
              echo "Skipping $repo: $DEST_BRANCH already exists"
            else
              echo "Failed to create $DEST_BRANCH in $repo"
              failed=$((failed + 1))
            fi
            cd ..

            # Clean up
            rm -rf "$repo"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed repository/repositories failed"
            exit 1
          fi

      - name: Send Slack notification
        if: ${{ github.event.inputs.notify_slack == 'true' }}
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          channel-id: '#team-ext-engineering-pr-notifications'
          slack-message: |
            *Code Freeze Branches Created*
            
            Branch `${{ github.event.inputs.destination_branch }}` was created from `${{ github.event.inputs.source_branch }}` in the following repositories:
            
            ${{ steps.build-repo-list.outputs.repositories_links }}
            
            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.UI_SLACK_AUTH_TOKEN }}

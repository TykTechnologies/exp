# yamllint disable rule:line-length
---
name: Code Freeze Branch Creation

run-name: 'Creating ${{ inputs.destination_branch }} from ${{ inputs.source_branch }} by ${{ github.actor }}'

# This workflow creates code freeze branches across multiple repositories.
# It creates the same branch in all specified repositories from the specified source branch.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Repositories to create branch in'
        required: true
        type: choice
        options:
          - tyk-core-products
          - tyk-sink
          - tyk-pump
          - portal
          - tyk-operator-internal
          - tyk-sync-internal
          - tyk-charts
          - tyk-identity-broker
      source_branch:
        description: 'Source Branch (branch to create from)'
        required: true
      destination_branch:
        description: 'Destination Branch (branch to create)'
        required: true
      notify_slack:
        description: 'Send Slack notification when complete'
        type: boolean
        default: false

jobs:
  create-branches:
    name: Create branches in selected repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

      - name: Build repository list
        id: build-repo-list
        run: |
          # Initialize empty array
          REPOS=()

          # Add repositories based on dropdown selection
          SELECTION="${{ github.event.inputs.repositories }}"
          if [ "$SELECTION" = "tyk-core-products" ]; then
            REPOS+=("tyk" "tyk-analytics" "tyk-analytics-ui")
          elif [ "$SELECTION" = "tyk-sink" ]; then
            REPOS+=("tyk-sink")
          elif [ "$SELECTION" = "tyk-pump" ]; then
            REPOS+=("tyk-pump")
          elif [ "$SELECTION" = "portal" ]; then
            REPOS+=("portal")
          elif [ "$SELECTION" = "tyk-operator-internal" ]; then
            REPOS+=("tyk-operator-internal")
          elif [ "$SELECTION" = "tyk-sync-internal" ]; then
            REPOS+=("tyk-sync-internal")
          elif [ "$SELECTION" = "tyk-charts" ]; then
            REPOS+=("tyk-charts")
          elif [ "$SELECTION" = "tyk-identity-broker" ]; then
            REPOS+=("tyk-identity-broker")
          fi
          
          # Convert array to JSON
          JSON_ARRAY=$(jq -nc '$ARGS.positional' --args -- "${REPOS[@]}")
          echo "repositories=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          
          # Create a comma-separated list for display
          REPOS_CSV=$(IFS=,; echo "${REPOS[*]}")
          echo "repositories_csv=$REPOS_CSV" >> "$GITHUB_OUTPUT"
          
          # Create Slack-formatted repository links
          REPOS_LINKS=""
          DEST_BRANCH_VAR="${{ github.event.inputs.destination_branch }}"
          for repo in "${REPOS[@]}"; do
            REPOS_LINKS="${REPOS_LINKS}- <https://github.com/TykTechnologies/${repo}/tree/${DEST_BRANCH_VAR} | ${repo}>\n"
          done
          echo "repositories_links<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$REPOS_LINKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create branches
        id: create-branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          DEST_BRANCH: ${{ github.event.inputs.destination_branch }}
        run: |
          # Get repositories as JSON array
          REPOSITORIES='${{ steps.build-repo-list.outputs.repositories }}'

          CREATED=()
          SKIPPED=()
          FAILED=()

          # Loop through each repository, isolating failures so one repo
          # can't abort the run for the rest of the selection.
          for repo in $(echo "$REPOSITORIES" | jq -r '.[]'); do
            echo "::group::$repo"

            # Skip cleanly if the destination branch already exists remotely,
            # instead of letting a push collide with it (stale-ref rejection).
            if gh api "repos/TykTechnologies/$repo/branches/$DEST_BRANCH" >/dev/null 2>&1; then
              echo "Branch $DEST_BRANCH already exists in $repo, skipping"
              SKIPPED+=("$repo")
              echo "::endgroup::"
              continue
            fi

            SOURCE_SHA=$(gh api "repos/TykTechnologies/$repo/commits/$SOURCE_BRANCH" --jq '.sha' 2>&1) || {
              echo "❌ Failed to resolve $SOURCE_BRANCH in $repo: $SOURCE_SHA"
              FAILED+=("$repo: could not resolve source branch")
              echo "::endgroup::"
              continue
            }

            # Create the branch via the API rather than a local clone + git
            # push. This removes the stale-ref race, but a required-status-
            # checks ruleset on the destination pattern will still reject a
            # brand-new branch (those checks can only report against commits
            # that went through a PR/CI run) unless the app is on that
            # ruleset's bypass list.
            API_ERROR=$(gh api "repos/TykTechnologies/$repo/git/refs" \
              -f "ref=refs/heads/$DEST_BRANCH" \
              -f "sha=$SOURCE_SHA" 2>&1 1>/dev/null) && {
              echo "✅ Created branch $DEST_BRANCH in $repo"
              CREATED+=("$repo")
            } || {
              echo "❌ Failed to create $DEST_BRANCH in $repo"
              echo "$API_ERROR"
              if echo "$API_ERROR" | grep -qi "rule violation\|required status check"; then
                FAILED+=("$repo: blocked by branch protection ruleset (app needs bypass, or branch must go through a PR)")
              else
                FAILED+=("$repo: $API_ERROR")
              fi
            }

            echo "::endgroup::"
          done

          {
            echo "## Code freeze branch creation summary"
            echo ""
            echo "Destination branch: \`$DEST_BRANCH\` from \`$SOURCE_BRANCH\`"
            echo ""
            echo "### Created (${#CREATED[@]})"
            printf -- '- %s\n' "${CREATED[@]}"
            echo ""
            echo "### Skipped, already existed (${#SKIPPED[@]})"
            printf -- '- %s\n' "${SKIPPED[@]}"
            echo ""
            echo "### Failed (${#FAILED[@]})"
            printf -- '- %s\n' "${FAILED[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Persist results for the Slack notification step.
          {
            printf 'created=%s\n' "$(IFS=,; echo "${CREATED[*]}")"
            printf 'skipped=%s\n' "$(IFS=,; echo "${SKIPPED[*]}")"
            printf 'failed_count=%s\n' "${#FAILED[@]}"
          } >> "$GITHUB_OUTPUT"

          # Fail the job only after every repo has been attempted, so the
          # summary above always reflects the full selection.
          if [ "${#FAILED[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: Send Slack notification
        if: ${{ always() && github.event.inputs.notify_slack == 'true' }}
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001  # v1.25.0
        with:
          channel-id: '#team-ext-engineering-pr-notifications'
          slack-message: |
            *Code Freeze Branch Creation: ${{ steps.create-branches.outputs.failed_count == '0' && 'Success' || 'Partial failure' }}*

            Branch `${{ github.event.inputs.destination_branch }}` from `${{ github.event.inputs.source_branch }}`

            Created: ${{ steps.create-branches.outputs.created }}
            Already existed (skipped): ${{ steps.create-branches.outputs.skipped }}
            Failed: ${{ steps.create-branches.outputs.failed_count }} (see run summary for details)

            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.UI_SLACK_AUTH_TOKEN }}
